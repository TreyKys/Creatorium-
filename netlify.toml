# NeuroDev Labs — static site, no build step.
[build]
  publish = "."

# Privacy policy pages live at /Context/privacy and /magnum-opus/privacy
# (each is a folder with its own index.html, so the clean URL just works).

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
